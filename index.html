<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>附近自助加油站</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* 版面:頂部定位列 → 篩選 → 地圖 → 依距離排序的站點卡片 */
:root{
  --bg:#f3f6f8; --surface:#ffffff; --fg:#14232e; --muted:#5d6f7c; --line:#d8e1e7;
  --accent:#0b5c8a; --accent-fg:#ffffff; --hot:#d9480f; --ok:#1f7a4d; --warn:#9a6700;
  --chip:#e6eef3; --shadow:0 1px 2px rgba(20,35,46,.08);
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-num:"Space Grotesk","Noto Sans TC",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1a22;--surface:#17252f;--fg:#e6eef3;--muted:#93a6b3;--line:#27394634;--line:#2a3d4a;
  --accent:#5cb6e6;--accent-fg:#06141d;--hot:#ff9a62;--ok:#5fd39a;--warn:#e8b64a;--chip:#223441;--shadow:none;color-scheme:dark}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--font-body);
  padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:22px;line-height:1.25;text-wrap:balance}
.sub{margin:2px 0 0;color:var(--muted);font-size:13px}
.bar{display:flex;gap:8px;flex-wrap:wrap}
button,input,select{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;cursor:pointer;min-height:42px}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:700}
.btn:focus-visible,input:focus-visible,select:focus-visible,.seg button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn[disabled]{opacity:.6;cursor:wait}
.addr{display:flex;gap:8px;flex:1 1 260px;min-width:0}
.addr input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px;min-height:42px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{flex:1;border:0;background:transparent;padding:9px 8px;cursor:pointer;min-height:42px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);font-weight:700}
#map{height:280px;border-radius:10px;border:1px solid var(--line);background:var(--chip)}
.status{font-size:13px;color:var(--muted);min-height:20px}
.status.err{color:var(--hot)}
.list{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;box-shadow:var(--shadow);display:grid;grid-template-columns:1fr auto;gap:4px 12px;cursor:pointer}
.card.active{border-color:var(--accent);outline:2px solid var(--accent)}
.card h2{margin:0;font-size:16px;line-height:1.35;min-width:0;overflow-wrap:anywhere}
.dist{font-family:var(--font-num);font-weight:700;font-size:20px;text-align:right;white-space:nowrap}
.dist small{font-size:12px;color:var(--muted);font-weight:500;margin-left:2px}
.meta{grid-column:1/-1;color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.tags{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--chip)}
.tag.self{background:var(--accent);color:var(--accent-fg);font-weight:700}
.tag.open{color:var(--ok)} .tag.closed{color:var(--hot)} .tag.hwy{color:var(--warn)}
.acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.acts a{font-size:14px;text-decoration:none;color:var(--accent);border:1px solid var(--line);border-radius:8px;padding:6px 12px;min-height:36px;display:inline-flex;align-items:center}
.acts a.nav{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:700}
.note{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.note b{color:var(--fg)}
details{font-size:13px;color:var(--muted)} summary{cursor:pointer}
.empty{padding:22px 8px;text-align:center;color:var(--muted)}
.pin{background:var(--accent);color:var(--accent-fg);border-radius:50%;width:26px;height:26px;display:grid;place-items:center;font:700 12px var(--font-num);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.me{background:var(--hot);width:16px;height:16px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--hot)}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <h1>附近自助加油站</h1>
    <p class="sub">台灣中油 · 依你目前位置由近到遠排序</p>
  </header>

  <div class="bar">
    <button id="locate" class="btn primary" type="button">使用目前位置</button>
    <form class="addr" id="addrForm">
      <input id="addr" type="search" placeholder="或輸入地址、地標(例:台中火車站)" aria-label="地址或地標">
      <button class="btn" type="submit">搜尋</button>
    </form>
  </div>

  <div class="seg" role="group" aria-label="自助類型">
    <button type="button" data-f="gas" aria-pressed="true">自助汽油</button>
    <button type="button" data-f="all" aria-pressed="false">全部中油站</button>
  </div>

  <div id="status" class="status" role="status" aria-live="polite">按「使用目前位置」開始搜尋。</div>
  <div id="map" aria-label="地圖"></div>
  <ol id="list" class="list"></ol>
  <button id="more" class="btn" type="button" hidden>顯示更多</button>

  <section class="note">
    <p><b>資料來源:</b><span id="src">尚未載入</span>。自助與否、營業狀態以現場為準,出發前可先電話確認。</p>
    <details>
      <summary>無法載入資料時</summary>
      <p>中油官方資料若被瀏覽器擋下(跨網域限制),頁面會改用 OpenStreetMap 的資料。你也可以自行開啟
      <a href="https://vipmbr.cpc.com.tw/CPCSTN/STNWebService.asmx/getStationInfo_XML" target="_blank" rel="noopener">中油加油站服務資訊 XML</a>,
      另存後在這裡選取檔案:</p>
      <input id="file" type="file" accept=".xml,text/xml,application/xml" aria-label="選取中油 XML 檔">
    </details>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){
'use strict';
var CPC_URL='https://vipmbr.cpc.com.tw/CPCSTN/STNWebService.asmx/getStationInfo_XML';
var CACHE_KEY='cpc-stations-v1', CACHE_MS=24*3600*1000, PAGE=15;
var state={stations:[],source:'',user:null,filter:'gas',shown:PAGE,sorted:[],active:-1};
var $=function(id){return document.getElementById(id)};
var map=null, layer=null, meMarker=null, markers=[];

function setStatus(t,err){var s=$('status');s.textContent=t;s.className='status'+(err?' err':'')}
function store(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function load(k){try{return localStorage.getItem(k)}catch(e){return null}}

/* ---------- 資料解析 ---------- */
function truthy(v){v=String(v==null?'':v).trim();if(!v)return false;return !/^(n|no|否|無|0|false|-|－|x|null|none)$/i.test(v)}
function num(v){var n=parseFloat(String(v).trim());return isFinite(n)?n:NaN}
function parseCPC(text){
  var doc=new DOMParser().parseFromString(text,'application/xml');
  if(doc.getElementsByTagName('parsererror').length) throw new Error('XML 格式錯誤');
  var root=doc.documentElement;
  if(!root.children.length){var inner=(root.textContent||'').trim();if(inner.charAt(0)==='<')return parseCPC(inner)}
  var out=[], els=doc.getElementsByTagName('*');
  for(var i=0;i<els.length;i++){
    var el=els[i], f={}, has=false;
    for(var j=0;j<el.children.length;j++){f[el.children[j].localName]=(el.children[j].textContent||'').trim()}
    if(f['緯度']!==undefined&&f['經度']!==undefined)has=true;
    if(!has)continue;
    var lat=num(f['緯度']), lng=num(f['經度']);
    if(lat>100&&lng<60){var t=lat;lat=lng;lng=t}
    if(!(lat>20&&lat<27&&lng>118&&lng<123))continue;
    out.push({
      id:f['站代號']||'', name:f['站名']||'中油加油站', cat:f['類別']||'',
      county:f['縣市']||'', town:f['鄉鎮區']||'', addr:f['地址']||'', tel:f['電話']||'',
      open:f['營業中'], hours:f['營業時間']||'', hwy:truthy(f['國道高速公路']),
      selfGas:truthy(f['刷卡自助']), selfDiesel:truthy(f['自助柴油站']),
      fuels:[['無鉛92','92'],['無鉛95','95'],['無鉛98','98'],['超柴','超柴'],['酒精汽油','酒精']].filter(function(p){return truthy(f[p[0]])}).map(function(p){return p[1]}),
      lat:lat, lng:lng
    });
  }
  return out;
}

async function fetchTimeout(url,opt,ms){
  var c=new AbortController(), t=setTimeout(function(){c.abort()},ms);
  try{opt=opt||{};opt.signal=c.signal;return await fetch(url,opt)}finally{clearTimeout(t)}
}

async function loadCPC(){
  var cached=load(CACHE_KEY);
  if(cached){try{var c=JSON.parse(cached);if(Date.now()-c.t<CACHE_MS&&c.d.length>100)return c.d}catch(e){}}
  var r=await fetchTimeout(CPC_URL,{},15000);
  if(!r.ok)throw new Error('HTTP '+r.status);
  var list=parseCPC(await r.text());
  if(list.length<100)throw new Error('資料筆數異常');
  store(CACHE_KEY,JSON.stringify({t:Date.now(),d:list}));
  return list;
}

async function loadOSM(lat,lng){
  var radii=[10000,25000,60000], list=[];
  for(var i=0;i<radii.length&&list.length<8;i++){
    var q='[out:json][timeout:25];nwr["amenity"="fuel"]["name"~"中油|CPC|台灣中油"](around:'+radii[i]+','+lat+','+lng+');out center tags;';
    var r=await fetchTimeout('https://overpass-api.de/api/interpreter?data='+encodeURIComponent(q),{},30000);
    if(!r.ok)throw new Error('Overpass HTTP '+r.status);
    var j=await r.json();
    list=j.elements.map(function(e){
      var t=e.tags||{}, la=e.lat||(e.center&&e.center.lat), lo=e.lon||(e.center&&e.center.lon);
      if(!la||!lo)return null;
      var self=t.self_service==='yes'||t.self_service==='only';
      var fuels=[];
      if(t['fuel:octane_92']==='yes')fuels.push('92');
      if(t['fuel:octane_95']==='yes')fuels.push('95');
      if(t['fuel:octane_98']==='yes')fuels.push('98');
      if(t['fuel:diesel']==='yes')fuels.push('柴油');
      return {id:'osm'+e.id,name:t['name:zh']||t.name||'中油加油站',cat:'',county:t['addr:city']||'',town:'',
        addr:[t['addr:city'],t['addr:district'],t['addr:street'],t['addr:housenumber']].filter(Boolean).join(''),
        tel:t.phone||t['contact:phone']||'',open:undefined,hours:t.opening_hours||'',hwy:false,
        selfGas:self,selfDiesel:false,fuels:fuels,lat:la,lng:lo};
    }).filter(Boolean);
  }
  return list;
}

/* ---------- 計算與顯示 ---------- */
function dist(a,b,c,d){var R=6371,r=Math.PI/180,dl=(c-a)*r,dg=(d-b)*r,
  x=Math.sin(dl/2)*Math.sin(dl/2)+Math.cos(a*r)*Math.cos(c*r)*Math.sin(dg/2)*Math.sin(dg/2);
  return 2*R*Math.asin(Math.sqrt(x))}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

function compute(){
  var u=state.user; if(!u){return}
  var f=state.filter;
  state.sorted=state.stations.filter(function(s){
    return f==='all'||s.selfGas;
  }).map(function(s){return {s:s,d:dist(u.lat,u.lng,s.lat,s.lng)}}).sort(function(a,b){return a.d-b.d});
}

function ensureMap(){
  if(map||!window.L){return}
  map=L.map('map',{zoomControl:true}).setView([23.7,121],7);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
  layer=L.layerGroup().addTo(map);
}

function render(){
  var list=$('list'), u=state.user;
  if(!u){return}
  var rows=state.sorted.slice(0,state.shown);
  if(!rows.length){
    list.innerHTML='<li class="empty">這個條件下找不到站點。可改選「全部中油站」。</li>';
    $('more').hidden=true;
  }else{
    list.innerHTML=rows.map(function(r,i){
      var s=r.s, tags='';
      if(s.selfGas)tags+='<span class="tag self">自助汽油</span>';
      if(s.open!==undefined&&s.open!==''){tags+=truthy(s.open)?'<span class="tag open">營業中</span>':'<span class="tag closed">暫停營業</span>'}
      if(s.hwy)tags+='<span class="tag hwy">國道</span>';
      s.fuels.forEach(function(x){tags+='<span class="tag">'+esc(x)+'</span>'});
      var addr=(s.county&&s.addr.indexOf(s.county)<0?s.county+s.town:'')+s.addr;
      var nav='https://www.google.com/maps/dir/?api=1&destination='+s.lat+','+s.lng+'&travelmode=driving';
      var dk=r.d<10?r.d.toFixed(1):Math.round(r.d);
      return '<li class="card" data-i="'+i+'" tabindex="0">'
        +'<h2>'+esc(s.name)+'</h2><div class="dist">'+dk+'<small>km</small></div>'
        +'<div class="meta">'+esc(addr)+(s.hours?' · '+esc(s.hours):'')+'</div>'
        +'<div class="tags">'+tags+'</div>'
        +'<div class="acts"><a class="nav" href="'+nav+'" target="_blank" rel="noopener">導航</a>'
        +(s.tel?'<a href="tel:'+esc(s.tel.replace(/[^\d+]/g,''))+'">'+esc(s.tel)+'</a>':'')+'</div></li>';
    }).join('');
    $('more').hidden=state.sorted.length<=state.shown;
  }
  drawMap(rows);
}

function drawMap(rows){
  ensureMap(); if(!map)return;
  layer.clearLayers(); markers=[];
  var u=state.user, pts=[[u.lat,u.lng]];
  L.marker([u.lat,u.lng],{icon:L.divIcon({className:'',html:'<div class="me"></div>',iconSize:[16,16],iconAnchor:[8,8]}),interactive:false}).addTo(layer);
  rows.slice(0,10).forEach(function(r,i){
    var m=L.marker([r.s.lat,r.s.lng],{icon:L.divIcon({className:'',html:'<div class="pin">'+(i+1)+'</div>',iconSize:[26,26],iconAnchor:[13,13]})})
      .addTo(layer).bindPopup(esc(r.s.name));
    m.on('click',function(){highlight(i,false)});
    markers.push(m); pts.push([r.s.lat,r.s.lng]);
  });
  map.fitBounds(L.latLngBounds(pts).pad(0.2),{maxZoom:15});
  setTimeout(function(){map.invalidateSize()},50);
}

function highlight(i,pan){
  state.active=i;
  var cards=document.querySelectorAll('.card');
  cards.forEach(function(c){c.classList.toggle('active',+c.dataset.i===i)});
  if(markers[i]){if(pan){map.setView(markers[i].getLatLng(),Math.max(map.getZoom(),15));markers[i].openPopup()}}
  var el=document.querySelector('.card[data-i="'+i+'"]'); if(el&&!pan)el.scrollIntoView({block:'nearest',behavior:'smooth'});
}

function summary(){
  var n=state.sorted.length, f=state.filter==='gas'?'自助汽油站':'中油加油站';
  if(!n){setStatus('附近沒有符合的站點。',true);return}
  var d=state.sorted[0].d;
  setStatus('最近的'+f+'在 '+(d<10?d.toFixed(1):Math.round(d))+' 公里外,共 '+n+' 站,顯示最近 '+Math.min(n,state.shown)+' 站。');
}

/* ---------- 取得資料 ---------- */
async function ensureData(){
  if(state.stations.length&&state.source!=='osm')return;
  setStatus('載入中油加油站資料…');
  try{
    state.stations=await loadCPC(); state.source='cpc';
    $('src').textContent='台灣中油加油站服務資訊(政府資料開放平臺,共 '+state.stations.length+' 站)';
  }catch(e){
    state.source='osm-pending';
  }
}
async function run(lat,lng,label){
  state.user={lat:lat,lng:lng}; state.shown=PAGE;
  try{
    await ensureData();
    if(state.source==='osm-pending'||state.source==='osm'){
      setStatus('中油官方資料無法直接讀取,改用 OpenStreetMap 資料搜尋…');
      state.stations=await loadOSM(lat,lng); state.source='osm';
      $('src').textContent='OpenStreetMap(中油官方資料無法讀取,自助標示可能不完整)';
    }
    compute(); render(); summary();
    if(label)setStatus(label+' · '+$('status').textContent);
  }catch(e){
    setStatus('資料載入失敗:'+e.message+'。請稍後再試,或在頁面下方選取中油 XML 檔。',true);
  }
}

function locate(){
  if(!navigator.geolocation){setStatus('這個瀏覽器不支援定位,請改用地址搜尋。',true);return}
  var b=$('locate'); b.disabled=true; setStatus('定位中…');
  navigator.geolocation.getCurrentPosition(function(p){
    b.disabled=false; run(p.coords.latitude,p.coords.longitude,'');
  },function(err){
    b.disabled=false;
    var m=err.code===1?'定位被拒絕,請允許瀏覽器使用位置,或改用地址搜尋。':'無法取得位置,請改用地址搜尋。';
    setStatus(m,true);
  },{enableHighAccuracy:true,timeout:15000,maximumAge:60000});
}

async function geocode(q){
  setStatus('搜尋地點…');
  try{
    var r=await fetchTimeout('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=tw&accept-language=zh-TW&q='+encodeURIComponent(q),{},15000);
    var j=await r.json();
    if(!j.length){setStatus('找不到這個地點,換個說法試試。',true);return}
    run(parseFloat(j[0].lat),parseFloat(j[0].lon),j[0].display_name.split(',')[0]);
  }catch(e){setStatus('地點搜尋失敗:'+e.message,true)}
}

/* ---------- 事件 ---------- */
$('locate').addEventListener('click',locate);
$('addrForm').addEventListener('submit',function(e){e.preventDefault();var q=$('addr').value.trim();if(q)geocode(q)});
document.querySelectorAll('.seg button').forEach(function(b){
  b.addEventListener('click',function(){
    state.filter=b.dataset.f; state.shown=PAGE;
    document.querySelectorAll('.seg button').forEach(function(x){x.setAttribute('aria-pressed',x===b?'true':'false')});
    if(state.user){compute();render();summary()}
  });
});
$('more').addEventListener('click',function(){state.shown+=PAGE;render();summary()});
$('list').addEventListener('click',function(e){
  if(e.target.closest('a'))return;
  var c=e.target.closest('.card'); if(c)highlight(+c.dataset.i,true);
});
$('list').addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target.classList.contains('card'))highlight(+e.target.dataset.i,true);
});
$('file').addEventListener('change',function(){
  var f=this.files[0]; if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var list=parseCPC(String(rd.result));
      if(!list.length)throw new Error('檔案裡沒有站點資料');
      state.stations=list; state.source='cpc';
      store(CACHE_KEY,JSON.stringify({t:Date.now(),d:list}));
      $('src').textContent='你選取的中油 XML 檔(共 '+list.length+' 站)';
      if(state.user){compute();render();summary()}else setStatus('已載入 '+list.length+' 站,請按「使用目前位置」。');
    }catch(e){setStatus('讀取檔案失敗:'+e.message,true)}
  };
  rd.readAsText(f,'utf-8');
});
ensureMap();
})();
</script>
</body>
</html>
